name: Test and Build Docker Image

on:
  push:
    branches:
      # Push to go* branches: run quick tests only
      - 'go*'
    tags:
      # Push go* tags: validate format, run full tests, and build image
      - 'go*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/go-errstack

jobs:
  # Quick test for branch pushes
  quick-test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: test
          load: true
          tags: go-errstack-test:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run error stack tests
        run: docker run --rm go-errstack-test:local

  # Validate tag format and run comprehensive tests for tag pushes
  validate-and-test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    outputs:
      go_version: ${{ steps.version.outputs.go_version }}
      patch_version: ${{ steps.version.outputs.patch_version }}
      full_version: ${{ steps.version.outputs.full_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate tag format and extract version
        id: version
        run: |
          # Tag format: go1.25.6-errstack0.0.1 -> go_version=1.25.6, patch_version=0.0.1
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^go([0-9]+\.[0-9]+\.[0-9]+)-errstack([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "go_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "patch_version=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
            echo "full_version=${BASH_REMATCH[1]}-${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
            echo "✅ Valid tag format: $TAG"
          else
            echo "❌ Error: Tag must be in format go<version>-errstack<patch>, e.g., go1.25.6-errstack0.0.1"
            echo "   Got: $TAG"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image for comprehensive tests
        uses: docker/build-push-action@v5
        with:
          context: .
          target: test
          load: true
          tags: go-errstack-test:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: false
          pull: true

      - name: Run comprehensive tests (all standard library)
        run: |
          echo "Running comprehensive tests for Go ${{ steps.version.outputs.go_version }} patch ${{ steps.version.outputs.patch_version }}"
          docker run --rm go-errstack-test:local sh ./run.bash --no-rebuild

  build-and-push:
    needs: validate-and-test
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.validate-and-test.outputs.full_version }}-alpine
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.validate-and-test.outputs.go_version }}-alpine
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=go-errstack
            org.opencontainers.image.description=Go with error stack trace support
            org.opencontainers.image.version=${{ needs.validate-and-test.outputs.full_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
